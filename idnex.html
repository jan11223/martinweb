<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Martas Tato</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
position:relative;
}

/* BACKGROUND */

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-1;
overflow:hidden;
}

.star{
position:absolute;
width:3px;
height:3px;
background:#b366ff;
border-radius:50%;
box-shadow:0 0 10px #b366ff;
animation:moveStars linear infinite;
}

@keyframes moveStars{
from{
transform:translateY(0px);
opacity:1;
}
to{
transform:translateY(-1200px);
opacity:0;
}
}

/* HERO */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:5rem;
background:linear-gradient(90deg,#ffffff,#b366ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

.hero p{
max-width:700px;
opacity:0.8;
font-size:1.1rem;
margin-bottom:30px;
}

/* BUTTON */

.glow-btn{
padding:15px 35px;
border:none;
border-radius:40px;
background:linear-gradient(45deg,#7b2cff,#c084ff);
color:white;
font-size:1rem;
cursor:pointer;
transition:0.4s;
position:relative;
overflow:hidden;
box-shadow:0 0 20px rgba(179,102,255,0.5);
}

.glow-btn:hover{
transform:scale(1.05);
box-shadow:0 0 40px rgba(179,102,255,1);
}

.glow-btn::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:rgba(255,255,255,0.1);
transform:rotate(45deg);
animation:shine 3s infinite;
}

@keyframes shine{
0%{
transform:translateX(-100%) rotate(45deg);
}
100%{
transform:translateX(100%) rotate(45deg);
}
}

/* SECTION */

.section{
padding:80px 20px;
max-width:1200px;
margin:auto;
}

.section h2{
text-align:center;
font-size:3rem;
margin-bottom:50px;
color:#c084ff;
}

/* FORM */

form{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:30px;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(179,102,255,0.2);
display:flex;
flex-direction:column;
gap:20px;
}

input,
textarea{
padding:15px;
border:none;
border-radius:15px;
background:#111;
color:white;
outline:none;
font-size:1rem;
}

textarea{
min-height:120px;
resize:none;
}

input[type="file"]{
background:#111;
padding:10px;
}

/* CALENDAR */

.calendar{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:15px;
margin-top:40px;
}

.day{
padding:25px;
border-radius:20px;
text-align:center;
font-weight:600;
transition:0.3s;
cursor:pointer;
}

.free{
background:#0f5132;
box-shadow:0 0 20px rgba(25,135,84,0.4);
}

.booked{
background:#58151c;
box-shadow:0 0 20px rgba(220,53,69,0.4);
}

.selected{
outline:3px solid #c084ff;
transform:scale(1.05);
}

.day:hover{
transform:translateY(-5px);
}

/* FOOTER */

footer{
text-align:center;
padding:40px;
opacity:0.6;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
font-size:3rem;
}

.section h2{
font-size:2rem;
}

form{
padding:25px;
}

}

</style>
</head>
<body>

<div class="stars" id="stars"></div>

<section class="hero">
<h1>Martas Tato</h1>
<p>
Luxury tattoo studio s moderním stylem, precizní prací a jedinečným designem.
Rezervuj si svůj termín jednoduše online.
</p>

<button class="glow-btn" onclick="scrollToBooking()">
Rezervovat termín
</button>
</section>

<section class="section" id="booking">
<h2>Rezervace</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="Jméno" required>

<input type="text" id="surname" placeholder="Příjmení" required>

<input type="text" id="contact" placeholder="Telefon / Instagram / Email" required>

<textarea id="idea" placeholder="Popis tetování"></textarea>

<input type="file" id="photo">

<h3>Vyber termín</h3>

<div class="calendar" id="calendar"></div>

<button type="submit" class="glow-btn">
Odeslat rezervaci
</button>

</form>

</section>

<footer>
© 2026 Martas Tato — Luxury Tattoo Experience
</footer>

<script>

// EMAILJS

(function(){
emailjs.init("YOUR_PUBLIC_KEY");
})();

// STARS

const starsContainer = document.getElementById('stars');

for(let i=0;i<120;i++){

const star = document.createElement('div');

star.classList.add('star');

star.style.left = Math.random()*100 + 'vw';

star.style.top = Math.random()*100 + 'vh';

star.style.animationDuration = (Math.random()*10+5)+'s';

star.style.opacity = Math.random();

starsContainer.appendChild(star);

}

// SCROLL

function scrollToBooking(){
document.getElementById('booking').scrollIntoView({
behavior:'smooth'
});
}

// CALENDAR

const calendar = document.getElementById('calendar');

const bookedDays = [4,8,12,17,24];

let selectedDay = null;

for(let i=1;i<=31;i++){

const day = document.createElement('div');

day.classList.add('day');

day.innerHTML = `Červen ${i}`;

if(bookedDays.includes(i)){

day.classList.add('booked');

day.innerHTML += '<br>Obsazeno';

}else{

day.classList.add('free');

day.innerHTML += '<br>Volno';

day.addEventListener('click',()=>{

document.querySelectorAll('.day').forEach(d=>{
d.classList.remove('selected');
});

day.classList.add('selected');

selectedDay = i;

});

}

calendar.appendChild(day);

}

// FORM

document.getElementById('bookingForm')
.addEventListener('submit',function(e){

e.preventDefault();

if(!selectedDay){

alert('Vyber termín.');
return;

}

const params = {

name:document.getElementById('name').value,

surname:document.getElementById('surname').value,

contact:document.getElementById('contact').value,

idea:document.getElementById('idea').value,

date:`Červen ${selectedDay}`

};

emailjs.send(
'YOUR_SERVICE_ID',
'YOUR_TEMPLATE_ID',
params
)

.then(function(){

alert('Rezervace byla odeslána.');

location.reload();

})

.catch(function(error){

alert('Chyba při odesílání.');

console.log(error);

});

});

</script>

</body>
</html>
